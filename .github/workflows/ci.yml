name: Build and test

# Netlify builds and deploys the site (see netlify.toml). This workflow only checks it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Browser smoke test
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
